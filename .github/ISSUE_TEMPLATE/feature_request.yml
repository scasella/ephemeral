name: Feature proposal
description: Describe a problem and a focused improvement.
body:
  - type: markdown
    attributes:
      value: Keep credentials, private repository content, and vulnerability details out of public proposals. Follow SECURITY.md for security reports.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters it, in which workflow, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful improvement and how you would tell it works.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Alternatives and constraints
      description: Include effects on session lifetime, saved work, permissions, cleanup, cost, and local preview where relevant.
